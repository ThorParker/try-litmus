      <button class="navbtn" data-go="next" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg><span>Next set</span></button>

    <span class="mode-badge" id="mode-badge">Checking connection</span>
    <div class="topbar-tools">
      <button class="iconbtn display-btn" id="display-btn" type="button" aria-expanded="false" aria-controls="display-panel" title="Accessibility: font, text size, and colours"><svg class="acc-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="7.2" r="1.4" fill="currentColor" stroke="none"/><path d="M7 9.8l5 1.2 5-1.2M12 11v3.6M12 14.6l-2.6 4M12 14.6l2.6 4"/></svg><span class="db-word">Accessibility</span></button>
    </div>
    <!-- Reading settings: one panel, opened by the Accessibility button. display.js draws each select
         below as a row of large buttons; the selects still hold the values. -->
    <div class="display-panel" id="display-panel">
      <div class="settings" role="group" aria-label="Reading settings">
        <label>Font
          <select id="set-font" aria-label="Font">
            <option value="lexend">Lexend Deca</option>
            <option value="system">System</option>
            <option value="serif">Serif</option>
          </select>
        </label>
        <label>Text size
          <select id="set-size" aria-label="Text size">
            <option value="normal">Standard (100%)</option>
            <option value="large">110%</option>
            <option value="xlarge">130%</option>
          </select>
        </label>
        <label>Colours
          <select id="set-theme" aria-label="Colours">
            <option value="light">Light</option>
            <option value="dark">Dark</option>
            <option value="contrast">High contrast</option>
            <option value="cvd">Colour-blind safe</option>
          </select>
        </label>
      </div>
      <!-- cp_12 (F2): the meaning-carrying marks, drawn in the current colours, so a change of mode shows at once. -->
      <div class="mode-sample" id="mode-sample" aria-hidden="true"><span class="ms-lv"><span class="cells"><i class="c1"></i><i></i><i></i></span>1</span><span class="ms-lv"><span class="cells"><i class="c1"></i><i class="c2"></i><i></i></span>2</span><span class="ms-lv"><span class="cells"><i class="c1"></i><i class="c2"></i><i class="c3"></i></span>3</span><span class="flag over ms-flag">Trusted wrong</span><span class="flag under ms-flag">Doubted right</span><span class="ms-good">Good call</span><span class="ms-careful">Careful</span></div>
      <div class="display-foot">
        <button class="iconbtn" id="install-btn" type="button" hidden>Install app</button>
        <div class="device-clear"><button class="btn small secondary" type="button" id="clear-device">Clear this device</button><p class="small muted" id="clear-device-note">Removes everything Litmus has saved in this browser.</p></div>
      </div>
    </div>
